<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favorites - Student Laptop Finder</title>
  <link rel="stylesheet" href="dist/output.css">
</head>
<body class="bg-page text-main min-h-screen flex flex-col">
  <script>
    // fetch() and modules do not work when a page is opened as a file
    if (location.protocol === "file:") document.body.insertAdjacentHTML("afterbegin", "<p class='bg-red-600 text-white p-3 text-center'>Please open this site with Live Server (http://...), not by double-clicking the file.</p>");
  </script>
  <header id="header" class="bg-card border-b border-line"></header>
  <main class="max-w-6xl w-full mx-auto px-4 py-6 flex-1">
    <h1 class="text-3xl font-bold mb-1 border-l-4 border-accent pl-3">Saved Favorites</h1>
    <p class="mb-4 opacity-70 pl-4">Your collection of favorite laptops. View details, compare them, or remove any from your list.</p>
    <section class="grid gap-4 sm:grid-cols-3 mb-8">
      <div class="card flex items-center gap-4"><span class="text-xl font-semibold text-accent">01</span><div><p id="savedNum" class="text-3xl font-bold">0</p><p class="opacity-70">Saved Laptops</p></div></div>
      <div class="card flex items-center gap-4"><span class="text-xl font-semibold text-accent">02</span><div><p class="opacity-70">Total Price</p><p id="totalPrice" class="text-3xl font-bold text-accent">EGP 0</p></div></div>
      <div class="card flex items-center gap-4"><span class="text-xl font-semibold text-accent">03</span><div><p class="opacity-70">Average Price</p><p id="avgPrice" class="text-3xl font-bold text-accent">EGP 0</p></div></div>
    </section>
    <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
      <h2 id="listTitle" class="text-2xl font-bold border-l-4 border-accent pl-3">Your Favorite Laptops</h2>
      <button id="clearBtn" class="btn-red">Clear All Favorites</button>
    </div>
    <section id="list" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></section>
  </main>
  <footer id="footer" class="bg-card border-t border-line"></footer>
  <script type="module" src="src/js/favorites.js"></script>
</body>
</html>
